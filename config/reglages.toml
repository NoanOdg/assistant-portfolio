# Reglages de l'assistant. Chaque cle peut etre remplacee par une variable
# d'environnement ASSISTANT_<SECTION>_<CLE> (exemple : ASSISTANT_MOTEUR_MODE=vertex).
# Aucun secret ici : les secrets arrivent par l'environnement (Secret Manager).

[moteur]
# "local" : faux embeddings, faux redacteur, recherche en memoire (tests, poste).
# "vertex" : Vertex AI et Firestore (Cloud Run). Jamais lance par les tests.
mode = "local"
# "chemin" : branche B, chemin fixe par le code (service deploye).
# "agent" : branche A, agent Gemini a outils (appels de fonctions), pour la
# comparaison A/B/C de la conception (section 6). Le service reste en "chemin"
# tant que la comparaison n'a pas tranche.
branche = "chemin"
projet_gcp = ""
# Embeddings : region unique. Gemini n'est pas servi en europe-west1 (verifie le
# 23/11/2026) : redaction et juge passent par la multiregion "eu", qui garde le
# traitement dans l'Union europeenne.
region = "europe-west1"
region_redaction = "eu"
modele_redaction = "gemini-3.1-flash-lite"   # verifie en eu le 23/11/2026
modele_embeddings = "gemini-embedding-001"
dimensions = 768
# Niveau de reflexion du modele de redaction (vide = valeur par defaut du modele).
# Verifie contre [modeles."<id>"].reflexions : 3.8 Flash refuse "minimal".
reflexion = "minimal"
temperature = 0.2
# Consigne de redaction : "v1" (prompts/redaction.md, servie) ou "v2"
# (prompts/redaction-v2.md, par classes d'erreurs : etude, fiche 3.9).
consigne = "v1"
# Contenu envoye au modele. "question_d_abord" : format servi (question, puis
# passages numerotes). "passages_d_abord" : passages, date, question, chacun
# entre balises declarees donnees ; le prefixe commun permet au cache implicite
# de jouer (defaut D1 de l'etude). Obligatoire en tout_le_corpus.
ordre_contenu = "question_d_abord"
# Date du jour donnee au modele, apres les passages (defaut D7).
date_du_jour = false
# Embeddings : type de tache des questions ("RETRIEVAL_QUERY" servi, ou
# "QUESTION_ANSWERING", fiche 3.3, option 3b) et titre de la page passe avec
# chaque document (option 3c). Changer l'un ou l'autre oblige a recaler le seuil.
tache_question = "RETRIEVAL_QUERY"
titre_document = false

[corpus]
# Fichier produit par assistant-ingerer. Le mode local l'indexe en memoire au demarrage.
fichier = "build/corpus.jsonl"
# Version servie : fixee par la CI au deploiement de chaque revision.
version = "local"
collection = "corpus"
# Decoupage (fiche 3.2) : "mots360" (servi, sections coupees au-dela de 360
# mots), "section" (section entiere), "page" (page entiere), "petit_grand"
# (morceaux de 360 mots pour chercher, page entiere pour lire). Lu par
# assistant-ingerer ; "petit_grand" joue aussi a la lecture.
decoupage = "mots360"
# Texte de la page Contact, coordonnees retirees (option 1b). Toujours ingere
# (type "contact"), servi seulement si vrai.
inclure_contact = false
# Corpus compact (option 1c) : un chiffre deja ecrit dans la prose de sa page
# ne reparait pas dans une fiche "metrique" de la meme page.
compact = false

[recherche]
# "rag" : passages trouves par la recherche (B, servi). "tout_le_corpus" : tout
# le site de la langue dans le contenu (C) ; la distance du meilleur passage est
# quand meme calculee et journalisee (defaut D10).
mode = "rag"
passages = 6
# Recherche hybride (option 4b) : BM25 en memoire et KNN, fusion RRF.
hybride = false
k_rrf = 60
candidats_hybride = 20
# Distance cosinus (1 - similarite). Au-dessus pour le meilleur passage : refus
# ecrit d'avance, sans appeler le modele. Valeur locale calee sur le faux
# embedder avec assistant-caler-seuil. Valeur Vertex : workflow GitHub "Calage du
# seuil", recopiee ici a la main apres relecture (seule source, pas de variable
# d'environnement).
seuil_distance_local = 0.759298
seuil_distance_vertex = 0.346760   # cale le 26/11/2026 apres la nouvelle lecture du site (6/18 hors sujet ecartes par le code, 1/20 ecarte a tort) ; -1 = non cale, refus de demarrer

[agent]
# Bornes de la branche A, appliquees par le code. Au-dela de max_appels_outils
# ou de max_tours, le dernier tour se joue sans outils (sortie forcee) ; au-dela
# du budget, le modele n'est plus appele.
max_appels_outils = 6
# Tours du modele, tour final compris : 3 tours d'outils puis la reponse.
max_tours = 4
# Jetons d'entree et de sortie cumules sur tous les tours d'une question.
budget_jetons = 30000
# Texte rendu par lire_page, au plus (la page est coupee entre deux sections).
caracteres_page = 12000

[aiguillage]
# "v1" : mots-cles servis. "classes" : tolerance d'une faute sur les mots de
# contact, telephone vers la carte avec un texte dedie, lexique de remuneration
# (fiche 3.6, option 6b). Mesure sur le banc evaluation/aiguillage.yaml.
# Par defaut depuis le 24/11/2026 : corrige trois familles d'erreurs connues des
# garde-fous du code (15 tournures sur 16 contre 11, aucun faux positif), sans
# quoi aucune configuration ne peut passer la condition 1 de la regle R0.
version = "classes"
# Sortie structuree du modele : intention (contact, personnel, question,
# hors_sujet) puis reponse. La carte et les refus restent rendus par le code
# (option 6c). Les mots-cles du code passent avant, comme raccourci.
etiquette_modele = false

[refus]
# Tout_le_corpus seulement : refus ecrit d'avance si le meilleur passage est
# au-dessus du seuil, sans appeler le modele (option 7c).
prefiltre_seuil = false

[limites]
caracteres_question = 500
jetons_reponse = 450
delai_reponse_s = 30
# Sans premier mot du modele apres ce delai, l'appel est rejoue (une fois) :
# une reponse normale commence en 1 s environ (mesure du 24/11/2026).
delai_premier_mot_s = 8
relances_premier_mot = 1
questions_par_minute = 5
questions_par_jour_visiteur = 30
questions_par_jour_global = 200
questions_par_jour_evaluation = 150
duree_session_s = 1800

[securite]
# CORS : seules ces origines peuvent appeler le service depuis un navigateur.
origines = ["https://noan-ouedraogo.dev"]
# Apercus Cloudflare Pages : https://<empreinte ou branche>.<projet>.pages.dev
# (et l'alias https://<projet>.pages.dev). Nom du projet Pages du portfolio,
# a recopier du tableau de bord Cloudflare ; vide = aucun apercu autorise.
projet_pages = "portfolio-hnq"
# Essais locaux du site (astro dev et astro preview). Pour les fermer en
# production : ASSISTANT_SECURITE_ORIGINES_LOCALES="" .
origines_locales = ["http://localhost:4321"]
# "altcha" : defi ALTCHA verifie a l'ouverture de session (production, et local
# avec une cle tiree au demarrage si ASSISTANT_SECRET_ALTCHA est vide).
# "desactive" : toute solution passe (mesures de charge seulement).
anti_robot = "altcha"
domaines_autorises = ["noan-ouedraogo.dev", "linkedin.com"]
# Compte de service autorise a jouer l'evaluation sur la revision candidate.
compte_evaluation = ""
# Audience des jetons d'identite de l'evaluation (chaine fixe : l'URL de la
# revision candidate change a chaque deploiement).
audience_evaluation = "assistant-portfolio-evaluation"
# Rang de l'adresse client dans X-Forwarded-For, compte depuis la fin.
# A verifier au jour 1 sur Cloud Run.
rang_ip_depuis_la_fin = 1

[altcha]
# Preuve de travail v2 de la bibliotheque altcha : trouver un compteur dont la
# cle derivee (PBKDF2/SHA-256, `cout` iterations) commence par `prefixe` (hexa).
# "00" : 256 essais en moyenne (duree sur telephone : a mesurer sur le widget).
# Verification : une seule derivation. Defi signe par HMAC-SHA-256 (cle dans
# Secret Manager), valable `expiration_s` secondes, utilisable une seule fois.
algorithme = "PBKDF2/SHA-256"
cout = 5000
prefixe = "00"
expiration_s = 120

[journal]
# Texte des questions garde 30 jours (TTL Firestore) pour enrichir le jeu d'evaluation.
garder_questions = false
duree_questions_jours = 30

[tarifs]
# Dollars par million de jetons. Prix des modeles de redaction et du juge : table
# [modeles] ci-dessous. A confirmer sur la premiere facture (etude, section 8).
embeddings = 0.15

# Un modele par table : prix en dollars par million de jetons (API Gemini, lus
# le 24/11/2026) pour l'entree, la sortie (reflexion comprise, facturee en
# sortie) et l'entree lue dans le cache ; niveaux de reflexion permis.
[modeles."gemini-3.1-flash-lite"]
entree = 0.25
sortie = 1.50
cache = 0.025
reflexions = ["minimal", "low", "medium", "high"]

[modeles."gemini-3.5-flash-lite"]
entree = 0.30
sortie = 2.50
cache = 0.03
reflexions = ["minimal", "low", "medium", "high"]

# Prix de decembre 2026 ; ils doublent au 01/01/2027 (1,50 / 7,50 / 0,15).
[modeles."gemini-3.8-flash"]
entree = 0.75
sortie = 3.75
cache = 0.075
reflexions = ["low", "medium", "high"]

[site]
url = "https://noan-ouedraogo.dev"
