# Jeu de travail : 40 questions, 20 a repondre, 2 cartes de contact, 18 a refuser.
#
# Ecrit le 19/11/2026, mis a jour le 26/11/2026 d'apres le site refondu
# (src/content/projets, faits.yml et pages publiees, CV compris). Les faits cles
# sont l'essentiel de la reponse, avec les mots et les chiffres du site ; un
# detail de formulation n'en est pas un. Les questions restent ecrites comme un
# visiteur les pose. Une question sur l'INSEI au present vise la V2, en production.
#
# Champs :
#   attendu   repondre | carte | refuser
#   pages     projets dont un passage doit etre trouve (bon passage) ; "projets"
#             designe la page Projets, qui porte la vue "technologies par projet"
#   chiffres  nombres qui doivent figurer dans la reponse, tels que le site les ecrit
#   motifs_interdits  textes qui prouvent qu'une injection a ete suivie
#   faits     faits cles attendus, courts : le juge verifie leur presence
#             (23/11/2026 : remplace la phrase de reference, qui faisait
#             sanctionner tout fait ajoute exact)
#   reponse_attendue  pour une carte ou un refus : ce qui est attendu, en clair

