# Reserve v2, BROUILLON du 23/11/2026 (refonte) : 15 questions, 7 en francais,
# 8 en anglais. 7 a repondre, 1 carte, 7 a refuser. Ni scellee ni jouee : Noan
# valide d'abord, puis assistant-sceller la remplace dans reserve-scellee.yaml
# (decision ecrite).
#
# Une fois scellee, elle n'est jouee qu'une fois, avant de publier un chiffre,
# et ne sert jamais a regler quoi que ce soit. Memes familles et memes regles
# que questions-v2-brouillon.yaml, formulations differentes, aucune question
# reprise. Les notes (depend_de_la_page_assistant, decision_mobilite_en_attente)
# ont le meme sens que dans le jeu de travail.

- id: x01
  langue: fr
  famille: renseignement
  question: "À partir de quand il pourrait commencer chez nous ?"
  attendu: repondre
  pages: [accueil, parcours, cv]
  chiffres: ["2027"]
  faits:
    - "disponible à partir de mars 2027"
  a_valider: true

