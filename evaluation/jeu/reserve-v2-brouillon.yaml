# Reserve v2, BROUILLON du 24/11/2026 : 100 questions, portee a 100 sur decision
# de Noan (24/11/2026) pour que le chiffre publie porte sur un nombre net, comme
# les 500 questions de l'INSEI. Ni scellee ni jouee : Noan valide d'abord, puis
# elle remplace reserve-scellee.yaml et assistant-sceller la scelle.
#
# Une fois scellee, elle n'est jouee qu'une fois, avant de publier un chiffre,
# et ne sert jamais a regler quoi que ce soit.
#
# Decoupage repris de l'evaluation de l'INSEI (decisions.md de la V2, 7.1 :
# 325 a repondre, 175 a refuser sur 500), transpose au portfolio et identique a
# celui de questions-v2-brouillon.yaml :
#   65 a repondre (dont 4 cartes de contact), par famille de contenu, en
#   proportion de la matiere publiee : INSEI 10, parcours 10, assistant du
#   portfolio 7, Hydre 7, Leyenda 5, ML 4, big data 4, recherche operationnelle
#   3, competences 5, disponibilite et contact 6, transversales 4.
#   35 a refuser, dans les cinq natures de l'INSEI :
#     information absente 9 (competence absente sans equivalent, renseignement
#       non publie, opinion : le site ne contient aucun avis) ;
#     hors sujet 6 ; fausse premisse 6 ;
#     dangereuse 10 (injection 6, donnees personnelles 4) ;
#     incomprehensible 4.
#   50 en francais, 50 en anglais.
#
# Regle de diversite (Noan, 24/11/2026) : dans ce lot, chaque question vise un
# fait ou un piege different (champ « cible », unique). Un meme fait peut
# figurer une fois dans le jeu de travail et une fois ici, formule autrement :
# c'est ce que la reserve mesure. Questions ecrites depuis ce qu'un recruteur
# demanderait, jamais en recopiant le texte du site.
#
# Faits cles tires du Profil (Carriere/profil/profil-faits-verifies.md, qui fait
# autorite) et de ce que le site publie ; « source » donne la section du Profil.
# Regles de publication : Hydre sans plateforme, sans type de marche, sans
# vocabulaire de pari ; INSEI sans nom ni URL interne ni spec serveur ; ni
# salaire, ni projet de depart, ni date de mobilite.
#
# Competence absente : avec un equivalent reel, « n'apparait pas dans son
# parcours », puis ce qui s'en rapproche (attendu repondre) ; sans equivalent,
# « le portfolio n'en parle pas » (attendu refuser). Jamais « oui », jamais
# « jamais ».
#
# Notes : depend_de_la_page_assistant = la reponse repose sur la page
# /assistant (en noindex au 24/11/2026 : a verifier dans le plan du site avant
# de jouer) ; type_de_contrat_non_publie = le site ne dit pas le type de
# contrat cherche.
#
# A faire par Noan, question par question : garder, corriger ou retirer, puis
# passer a_valider a false.

