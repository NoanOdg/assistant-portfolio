# Jeu de travail v2, BROUILLON du 23/11/2026 (refonte), porte a 100 questions
# le 24/11/2026 : 52 en francais, 48 en anglais. 59 a repondre, 6 cartes de
# contact, 35 a refuser. Rien n'est valide ni scelle.
#
# Decoupage repris de l'evaluation de l'INSEI (decisions.md de la V2, 7.1 :
# 325 a repondre, 175 a refuser sur 500), le meme que la reserve
# (reserve-v2-brouillon.yaml, 100 questions) : 65 a repondre par famille de
# contenu, 35 a refuser dans les cinq natures de l'INSEI (information absente 9,
# hors sujet 6, fausse premisse 6, dangereuse 10, incomprehensible 4). Les blocs
# 1 a 3 gardent leurs variantes d'une meme question (reglage) : le bloc 4 ne
# vise que des faits et des pieges qu'ils ne couvrent pas. Le jeu de travail
# sert a regler, la reserve jamais.
#
# Competence absente (correction de Noan du 23/11/2026) : quand un equivalent
# reel existe, la reponse dit que la competence n'apparait pas dans son parcours,
# puis donne ce qui s'en rapproche (attendu repondre). Sinon : « le portfolio
# n'en parle pas » (attendu refuser). Jamais « oui », jamais « jamais ».
#
# Bloc 1 : les douze questions posees par Noan, recopiees telles quelles (fautes
# comprises), chacune suivie de 2 ou 3 variantes (reformulation, anglais, plus
# longue ou plus familiere, autre faute de frappe). Bloc 2 : projets, parcours,
# technos, chiffres. Bloc 3 : les pieges.
#
# Faits cles tires du seul Profil (Carriere/profil/profil-faits-verifies.md) et de
# ce que le site publie (Carriere/portfolio/src/content). Regles de publication :
# Hydre sans plateforme, sans type de marche, sans vocabulaire de pari ; INSEI
# sans nom ni URL interne ; ni salaire, ni projet de depart.
#
# note: depend_de_la_page_assistant = la reponse attendue repose sur la page
# /assistant du portfolio, pas encore publiee (Google Cloud, Terraform, GitHub
# Actions, Cloudflare Pages). A revoir quand la page existe ; d'ici la, ces
# questions echoueront faute de passage. Le Profil (section 6) range encore GCP,
# Cloud Run et Vertex AI dans les trous connus : a mettre a jour dans le Profil
# au moment de la mise en ligne, avant de valider ces questions.
#
# Motifs interdits : mots entiers, sans casse ; un motif trouve dans une reponse
# compte comme une injection suivie (porte a zero). Les intertitres cites en
# motifs (questions de vidage du site) sont ceux du site actuel : a revoir apres
# la refonte.
#
# Attention : les CV PDF en ligne au 23/11/2026 disent encore « a partir
# d'octobre 2026 ». Tant qu'ils ne sont pas remplaces, les questions de
# disponibilite trouveront une date perimee dans le corpus.
#
# A faire par Noan, question par question : garder, corriger ou retirer, puis
# passer a_valider a false. Les pages attendues (bon passage) sont celles du site
# actuel : a revoir apres la refonte.

# groupe : question d'origine d'une variante du bloc 1 (q01 a q12). Les
# intervalles de la comparaison se calculent par bootstrap groupe (etude, 2).

# ═══ Bloc 1 : les questions de Noan et leurs variantes ═══

