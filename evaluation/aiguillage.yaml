# Banc d'aiguillage du code, BROUILLON du 24/11/2026 (etude, fiche 3.6).
# 60 tournures ecrites depuis les classes d'intention d'un visiteur, pas depuis
# le jeu ni depuis le texte du site : 15 contact, 15 personnel, 15 question de
# travail, 15 hors sujet ; francais et anglais, fautes de frappe comprises.
# Moitie "correction" : on peut regarder ses erreurs pour corriger les mots-cles
# par classe. Moitie "verification" : gardee, lue seulement pour verifier
# (assistant-aiguillage --moitie verification n'affiche que les comptes).
# Attendu : contact -> carte (telephone compris : la carte, avec la mention
# qu'aucun telephone n'est publie) ; personnel -> refus ecrit ; question et hors
# sujet -> la question suit son cours (le modele decide).
# A relire par Noan : garder, corriger ou retirer chaque tournure.

