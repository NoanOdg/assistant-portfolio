[project]
name = "assistant-portfolio"
version = "0.1.0"
description = "Assistant public du portfolio noan-ouedraogo.dev : RAG sur Vertex AI, Cloud Run et Firestore."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Implementations Google Cloud. Absentes des tests : tout tourne avec les faux.
gcp = [
    "google-genai>=1.0",
    "google-cloud-firestore>=2.19",
    "google-auth>=2.30",
    "requests>=2.32",
]

[project.scripts]
assistant-ingerer = "assistant.corpus.ingestion:main"
assistant-indexer = "assistant.indexation:main"
assistant-evaluer = "assistant.evaluation.executer:main"
assistant-porte = "assistant.evaluation.porte:main"
assistant-caler-seuil = "assistant.evaluation.seuil:main"
assistant-sceller = "assistant.evaluation.sceller:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = [
    "RUF001",  # caracteres ambigus : le corpus est en francais
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
