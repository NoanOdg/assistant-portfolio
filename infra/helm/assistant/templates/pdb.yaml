apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "assistant.nom" . }}
  labels:
    {{- include "assistant.etiquettes" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minDisponibles }}
  selector:
    matchLabels:
      {{- include "assistant.selection" . | nindent 6 }}
