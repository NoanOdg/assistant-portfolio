apiVersion: v1
kind: Service
metadata:
  name: {{ include "assistant.nom" . }}
  labels:
    {{- include "assistant.etiquettes" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "assistant.selection" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
